# Velox Configuration Template
# Place at /etc/velox/config.yaml or ~/.velox/config.yaml

# Data directory for SQLite database and state
data_dir: "/var/lib/velox"

# Logging: debug, info, warn, error
log_level: "info"
log_json: false

# Profile proxy listeners. Each profile (created in the dashboard) gets its own
# SOCKS5+HTTP port with a username and password, bound to this address.
proxy:
  listen_addr: "0.0.0.0"    # Use a specific IP to bind one interface only
  fail_threshold: 3         # Consecutive dial failures before failing over to the next-best node

# Debug options
debug:
  pprof_enabled: false
  pprof_addr: "127.0.0.1:6060"
