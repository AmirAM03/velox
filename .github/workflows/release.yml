name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Determine Version
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v0.1.0-dev"
          fi
          echo "TAG=$TAG" >> $GITHUB_OUTPUT

      - name: Build Matrix Binaries
        env:
          CGO_ENABLED: 0
          TAG: ${{ steps.version.outputs.TAG }}
        run: |
          mkdir -p dist

          PLATFORMS=(
            "linux/amd64/velox"
            "linux/arm64/velox"
            "windows/amd64/velox.exe"
            "darwin/arm64/velox"
          )

          for PLATFORM in "${PLATFORMS[@]}"; do
            IFS='/' read -r OS ARCH BIN_NAME <<< "$PLATFORM"
            OUTPUT_DIR="build_${OS}_${ARCH}"
            mkdir -p "$OUTPUT_DIR"

            echo "Building for $OS/$ARCH..."
            GOOS=$OS GOARCH=$ARCH go build -trimpath -ldflags="-s -w -X github.com/AmirAM03/velox/internal/build.Version=${TAG}" -o "$OUTPUT_DIR/$BIN_NAME" ./cmd/velox/

            cp config.example.yaml "$OUTPUT_DIR/"
            if [ "$OS" = "linux" ]; then
              cp velox.service install.sh "$OUTPUT_DIR/"
            fi

            ARCHIVE="dist/velox-${TAG}-${OS}-${ARCH}.tar.gz"
            if [ "$OS" = "windows" ]; then
              ARCHIVE="dist/velox-${TAG}-${OS}-${ARCH}.zip"
              (cd "$OUTPUT_DIR" && zip -r "../../$ARCHIVE" .)
            else
              tar -czf "$ARCHIVE" -C "$OUTPUT_DIR" .
            fi
          done

      - name: Generate Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*
          generate_release_notes: true
          draft: false
          prerelease: false
